<!-- Include jQuery, jQuery UI, elFinder (REQUIRED) -->
<link rel="stylesheet" type="text/css" href="/admin/components/elfinder/css/elfinder.min.css"/>
<link rel="stylesheet" type="text/css" href="/admin/css/style.css"/>
<link rel="stylesheet" type="text/css" href="/admin/css/ui-custom.css"/>
<script type="text/javascript" src="/admin/js/jquery.min.js"></script>
<script type="text/javascript" src="/admin/components/ui/jquery.ui.min.js"></script>
<script type="text/javascript" src="/admin/components/elfinder/js/elfinder.min.js"></script>
<!-- TinyMCE Popup class (REQUIRED) -->
<script type="text/javascript" src="../../tiny_mce_popup.js"></script>


<script type="text/javascript">
  var FileBrowserDialogue = {
    init: function() {
      // Here goes your code for setting your custom things onLoad.
    },
    mySubmit: function (URL) {
      var win = tinyMCEPopup.getWindowArg('window');

      // pass selected file path to TinyMCE
      win.document.getElementById(tinyMCEPopup.getWindowArg('input')).value = URL;

      // are we an image browser?
      if (typeof(win.ImageDialog) != 'undefined') {
        // update image dimensions
        if (win.ImageDialog.getImageData) {
          win.ImageDialog.getImageData();
        }
        // update preview if necessary
        if (win.ImageDialog.showPreviewImage) {
          win.ImageDialog.showPreviewImage(URL);
        }
      }

      // close popup window
      tinyMCEPopup.close();
    }
  }

  tinyMCEPopup.onInit.add(FileBrowserDialogue.init, FileBrowserDialogue);

  $().ready(function() {
    var elf = $('#elfinder').elfinder({
      
      url: '/admin/components/elfinder/connectors/php/connector.php',  // connector URL
      editorCallback: function(url) { // editor callback
        FileBrowserDialogue.mySubmit(url); // pass selected file path to TinyMCE 
      }
    });      
  });
</script>
<div id="elfinder">finder</div>
