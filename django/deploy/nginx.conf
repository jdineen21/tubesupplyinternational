# nginx for the six Tube Supply International domains, all served by the
# one Django/Wagtail site (gunicorn, see tsi.service).
#
# Install as /etc/nginx/sites-available/tubesupplyinternational and link it
# from sites-enabled. Paths assume the layout in django/README.md (/srv/tsi).
# One certificate covers all twelve names (see "HTTPS" in django/README.md).

upstream tsi_django {
    server unix:/run/tsi/gunicorn.sock fail_timeout=0;
}

# www.example.tld for example.tld and www.example.tld
map $host $tsi_www_host {
    ~^(?:www\.)?(?<domain>.+)$ www.$domain;
}

# Plain http: everything moves to https on the www name
server {
    listen 80;
    listen [::]:80;
    server_name tubesupplyinternational.co.uk www.tubesupplyinternational.co.uk
                tubesupplyinternational.es    www.tubesupplyinternational.es
                tubesupplyinternational.fr    www.tubesupplyinternational.fr
                tubesupplyinternational.pt    www.tubesupplyinternational.pt
                tubesupplyinternational.ru    www.tubesupplyinternational.ru
                tubesupplyinternational.sa.com www.tubesupplyinternational.sa.com;

    location / {
        return 301 https://$tsi_www_host$request_uri;
    }
}

# https without www: to the www name
server {
    # (on nginx 1.25 and later this may be written "listen 443 ssl;" plus "http2 on;")
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tubesupplyinternational.co.uk tubesupplyinternational.es tubesupplyinternational.fr
                tubesupplyinternational.pt tubesupplyinternational.ru tubesupplyinternational.sa.com;

    ssl_certificate     /etc/letsencrypt/live/tubesupplyinternational/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tubesupplyinternational/privkey.pem;

    return 301 https://$tsi_www_host$request_uri;
}

server {
    # (on nginx 1.25 and later this may be written "listen 443 ssl;" plus "http2 on;")
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tubesupplyinternational.co.uk www.tubesupplyinternational.es www.tubesupplyinternational.fr
                www.tubesupplyinternational.pt www.tubesupplyinternational.ru www.tubesupplyinternational.sa.com;

    ssl_certificate     /etc/letsencrypt/live/tubesupplyinternational/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tubesupplyinternational/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # picture and document uploads in the admin
    client_max_body_size 25m;

    location /static/ {
        alias /srv/tsi/static/;
        expires 30d;
        access_log off;
    }

    # pictures and documents uploaded in the admin; nothing here is ever run
    location /media/ {
        alias /srv/tsi/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    # the PDFs the old sites linked to (certificate, brochure)
    location /downloads/ {
        alias /srv/tsi/app/django/downloads/;
    }

    # the old sites' stylesheets and pictures were under /frontend/
    location /frontend/ {
        return 301 /static$request_uri;
    }

    location / {
        proxy_pass http://tsi_django;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
